<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>10分鐘免費按摩體驗</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

body{
  font-family:Arial,"Noto Sans TC",sans-serif;
  background:#f7f5f2;
  margin:0;
  padding:20px;
  color:#333;
}

.wrap{
  max-width:560px;
  margin:auto;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:24px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h1{
  font-size:24px;
  margin:0 0 8px;
}

.sub{
  color:#777;
  margin-bottom:24px;
}

label{
  display:block;
  font-weight:600;
  margin:18px 0 8px;
}

input,
select{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  background:#fff;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:17px;
  font-weight:700;
  background:#333;
  color:#fff;
  margin-top:22px;
}

button:disabled{
  opacity:.5;
}

.notice{
  background:#faf7ef;
  border-radius:12px;
  padding:14px;
  line-height:1.7;
  font-size:14px;
  margin-top:20px;
}

.success{
  display:none;
  text-align:center;
}

.error{
  color:#b42318;
  margin-top:12px;
  line-height:1.5;
}

.loading{
  color:#777;
  margin-top:12px;
}

</style>

</head>


<body>

<div class="wrap">

  <!-- 預約表單 -->

  <div class="card" id="formCard">

    <h1>10分鐘免費按摩體驗</h1>

    <div class="sub">
      2026/8/29｜每次體驗 10 分鐘
    </div>


    <label>1. 姓名</label>

    <input
      id="name"
      maxlength="30"
      placeholder="請輸入姓名"
    >


    <label>2. 手機號碼</label>

    <input
      id="phone"
      maxlength="10"
      inputmode="numeric"
      placeholder="09XXXXXXXX"
    >


    <label>3. 預約時段</label>

    <select id="slot">

      <option value="">
        載入可預約時段中…
      </option>

    </select>


    <div class="notice">

      <strong>4. 注意事項</strong><br>

      ・本次按摩體驗每人限預約 1 個時段。<br>

      ・每次體驗時間為 10 分鐘。<br>

      ・請於預約時間前 5 分鐘至現場報到。<br>

      ・逾預約時間 3 分鐘未報到，名額可能開放予現場候補。<br>

      ・預約成功及體驗前提醒將透過 LINE 官方帳號發送。<br>

      ・如臨時無法參加，請提前取消預約。

    </div>


    <button
      id="submitBtn"
      onclick="submitBooking()"
      disabled
    >
      確認預約
    </button>


    <div
      id="error"
      class="error"
    ></div>

    <div
      id="status"
      class="loading"
    >
      ① 開始初始化 LINE…
    </div>

  </div>


  <!-- 成功畫面 -->

  <div
    class="card success"
    id="successCard"
  >

    <h1>🎉 預約成功</h1>

    <p id="successText"></p>

    <div class="notice">

      請於體驗前 5 分鐘至活動按摩體驗區報到。<br>

      LINE 將於體驗前約 10 分鐘提醒您。

    </div>

  </div>

</div>


<script>


/* ================================
   基本設定
================================ */

const LIFF_ID =
  '2011276461-dzqaRMGb';


const GAS_API =
  'https://script.google.com/macros/s/AKfycbyvvtOVFJPce3CdEZJ7QEfdnm0Ia6nziNpDN42_uhkfbersVE534Ty8tFJ1Sc1ku_xy/exec';


let TOKEN = '';

let LINE_ID_TOKEN = '';


/* ================================
   DOM
================================ */

const statusEl =
  document.getElementById('status');

const errorEl =
  document.getElementById('error');

const slotEl =
  document.getElementById('slot');

const submitBtn =
  document.getElementById('submitBtn');


/* ================================
   JSONP
================================ */

function jsonp(url){

  return new Promise(function(resolve,reject){

    const callbackName =
      'jsonp_' +
      Date.now() +
      '_' +
      Math.floor(Math.random()*10000);

    const script =
      document.createElement('script');

    const timeout =
      setTimeout(function(){

        cleanup();

        reject(
          new Error('API 連線逾時')
        );

      },15000);


    function cleanup(){

      clearTimeout(timeout);

      if(script.parentNode){
        script.parentNode.removeChild(script);
      }

      try{
        delete window[callbackName];
      }catch(e){
        window[callbackName] = undefined;
      }

    }


    window[callbackName] =
      function(data){

        cleanup();

        resolve(data);

      };


    script.onerror =
      function(){

        cleanup();

        reject(
          new Error('無法連線至預約系統')
        );

      };


    script.src =
      url +
      '&callback=' +
      encodeURIComponent(callbackName);


    document.body.appendChild(script);

  });

}


/* ================================
   LIFF 初始化
================================ */

async function initLIFF(){

  try{

    statusEl.textContent =
      '① 開始初始化 LINE…';


    await liff.init({

      liffId:LIFF_ID,

      withLoginOnExternalBrowser:true

    });


    statusEl.textContent =
      '② LIFF 初始化成功';


    console.log(
      'LIFF App:',
      liff.isInClient()
    );

    console.log(
      'LIFF Login:',
      liff.isLoggedIn()
    );


    if(!liff.isLoggedIn()){

      statusEl.textContent =
        '③ 正在登入 LINE…';

      liff.login();

      return;

    }


    statusEl.textContent =
      '③ LINE 登入成功';


    LINE_ID_TOKEN =
      liff.getIDToken();


    if(!LINE_ID_TOKEN){

      throw new Error(
        '無法取得 LINE ID Token'
      );

    }


    statusEl.textContent =
      '④ LINE 身分驗證中…';


    await createToken();


    statusEl.textContent =
      '⑤ LINE 身分驗證成功';


    await loadSlots();


    statusEl.textContent =
      '⑥ 預約時段載入完成';

  }

  catch(err){

    console.error(err);

    statusEl.textContent =
      '';

    errorEl.textContent =
      '❌ ' +
      (err.message || err);

  }

}


/* ================================
   建立預約 Token
================================ */

async function createToken(){

  const url =
    GAS_API +
    '?api=createToken' +
    '&idToken=' +
    encodeURIComponent(
      LINE_ID_TOKEN
    );


  const result =
    await jsonp(url);


  console.log(
    'createToken:',
    result
  );


  if(
    !result ||
    !result.ok ||
    !result.token
  ){

    throw new Error(
      result?.error ||
      '無法建立預約連結'
    );

  }


  TOKEN =
    result.token;

}


/* ================================
   載入時段
================================ */

async function loadSlots(){

  slotEl.innerHTML =
    '<option>載入可預約時段中…</option>';

  submitBtn.disabled = true;


  const result =
    await jsonp(
      GAS_API +
      '?api=getSlots'
    );


  console.log(
    'getSlots:',
    result
  );


  if(
    !result ||
    !result.ok
  ){

    throw new Error(
      result?.error ||
      '時段載入失敗'
    );

  }


  const slots =
    result.slots || [];


  slotEl.innerHTML =
    '<option value="">請選擇預約時段</option>';


  if(!slots.length){

    slotEl.innerHTML =
      '<option value="">目前無可預約時段</option>';

    return;

  }


  slots.forEach(function(s){

    const option =
      document.createElement('option');


    option.value =
      s.start;


    option.textContent =
      s.start +
      '–' +
      s.end +
      '　剩餘 ' +
      s.remaining +
      ' 名';


    slotEl.appendChild(option);

  });


  submitBtn.disabled = false;

}


/* ================================
   提交預約
================================ */

async function submitBooking(){

  errorEl.textContent = '';


  const name =
    document
      .getElementById('name')
      .value
      .trim();


  const phone =
    document
      .getElementById('phone')
      .value
      .trim();


  const start =
    slotEl.value;


  const cleanPhone =
    phone.replace(/\D/g,'');


  if(!name){

    errorEl.textContent =
      '請輸入姓名。';

    return;

  }


  if(!/^09\d{8}$/.test(cleanPhone)){

    errorEl.textContent =
      '請輸入正確的 10 碼手機號碼。';

    return;

  }


  if(!start){

    errorEl.textContent =
      '請選擇預約時段。';

    return;

  }


  if(!TOKEN){

    errorEl.textContent =
      'LINE 預約連結尚未建立。';

    return;

  }


  submitBtn.disabled = true;

  submitBtn.textContent =
    '預約處理中…';


  try{

    const url =
      GAS_API +
      '?api=submitBooking' +
      '&name=' +
      encodeURIComponent(name) +
      '&phone=' +
      encodeURIComponent(cleanPhone) +
      '&start=' +
      encodeURIComponent(start) +
      '&token=' +
      encodeURIComponent(TOKEN);


    const result =
      await jsonp(url);


    console.log(
      'submitBooking:',
      result
    );


    if(
      !result ||
      !result.ok
    ){

      throw new Error(
        result?.error ||
        '預約失敗'
      );

    }


    document
      .getElementById('formCard')
      .style.display =
      'none';


    document
      .getElementById('successCard')
      .style.display =
      'block';


    document
      .getElementById('successText')
      .innerHTML =

      '預約編號：<strong>' +
      result.bookingNo +
      '</strong><br><br>' +

      '⏰ ' +
      result.start +
      '–' +
      result.end;


  }

  catch(err){

    console.error(err);

    errorEl.textContent =
      err.message ||
      '預約失敗，請重新選擇時段。';


    submitBtn.disabled = false;

    submitBtn.textContent =
      '確認預約';


    try{

      await loadSlots();

    }catch(e){}

  }

}


/* ================================
   啟動
================================ */

initLIFF();

</script>

</body>

</html>
