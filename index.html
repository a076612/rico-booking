<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>10分鐘免費按摩體驗</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body{
      font-family:Arial,"Noto Sans TC",sans-serif;
      background:#f7f5f2;
      margin:0;
      padding:20px;
      color:#333;
    }

    .wrap{
      max-width:560px;
      margin:auto;
    }

    .card{
      background:#fff;
      border-radius:18px;
      padding:24px;
      box-shadow:0 4px 18px rgba(0,0,0,.08);
    }

    h1{
      font-size:24px;
      margin:0 0 8px;
    }

    .sub{
      color:#777;
      margin-bottom:24px;
    }

    label{
      display:block;
      font-weight:600;
      margin:18px 0 8px;
    }

    input,
    select{
      width:100%;
      box-sizing:border-box;
      padding:13px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:16px;
      background:#fff;
    }

    button{
      width:100%;
      border:0;
      border-radius:12px;
      padding:14px;
      font-size:17px;
      font-weight:700;
      background:#333;
      color:#fff;
      margin-top:22px;
    }

    button:disabled{
      opacity:.5;
    }

    .notice{
      background:#faf7ef;
      border-radius:12px;
      padding:14px;
      line-height:1.7;
      font-size:14px;
      margin-top:18px;
    }

    .success{
      display:none;
      text-align:center;
    }

    .error{
      color:#b42318;
      margin-top:12px;
      line-height:1.5;
      white-space:pre-wrap;
    }

    .loading{
      color:#777;
    }
  </style>
</head>


<body>

<div class="wrap">

  <!-- ========================= -->
  <!-- 預約表單 -->
  <!-- ========================= -->

  <div class="card" id="formCard">

    <h1>10分鐘免費按摩體驗</h1>

    <div class="sub">
      2026/8/29｜每次體驗 10 分鐘
    </div>


    <label>1. 姓名</label>

    <input
      id="name"
      maxlength="30"
      placeholder="請輸入姓名"
    >


    <label>2. 手機號碼</label>

    <input
      id="phone"
      maxlength="10"
      inputmode="numeric"
      placeholder="09XXXXXXXX"
    >


    <label>3. 預約時段</label>

    <select id="slot">
      <option value="">
        載入可預約時段中…
      </option>
    </select>


    <div class="notice">

      <strong>4. 注意事項</strong><br>

      ・本次按摩體驗每人限預約 1 個時段。<br>

      ・每次體驗時間為 10 分鐘。<br>

      ・請於預約時間前 5 分鐘至現場報到。<br>

      ・逾預約時間 3 分鐘未報到，名額可能開放予現場候補。<br>

      ・預約成功及體驗前提醒將透過 LINE 官方帳號發送。<br>

      ・如臨時無法參加，請提前取消預約。

    </div>


    <button
      id="submitBtn"
      onclick="submitBooking()"
      disabled
    >
      確認預約
    </button>


    <div
      id="error"
      class="error"
    ></div>

  </div>


  <!-- ========================= -->
  <!-- 預約成功 -->
  <!-- ========================= -->

  <div
    class="card success"
    id="successCard"
  >

    <h1>🎉 預約成功</h1>

    <p id="successText"></p>

    <div class="notice">

      請於體驗前 5 分鐘至活動按摩體驗區報到。<br>

      LINE 將於體驗前約 10 分鐘提醒您。

    </div>

  </div>

</div>


<script>

/* =====================================================
   基本設定
===================================================== */

const LIFF_ID =
  '2011276461-dzqaRMGb';


const GAS_API_URL =
  'https://script.google.com/macros/s/AKfycbyvvtOVFJPce3CdEZJ7QEfdnm0Ia6nziNpDN42_uhkfbersVE534Ty8tFJ1Sc1ku_xy/exec';


let LINE_ID_TOKEN = '';

let TOKEN = '';



/* =====================================================
   顯示錯誤
===================================================== */

function showError(message){

  document.getElementById('error').textContent =
    message || '';

}



/* =====================================================
   LIFF 初始化
===================================================== */

async function initLIFF(){

  try{

    showError('① 開始初始化 LINE…');


    await liff.init({
      liffId: LIFF_ID
    });


    showError('② LIFF 初始化成功');


    console.log(
      'LIFF:',
      liff.isInClient(),
      liff.isLoggedIn()
    );


    /*
     * 如果不是 LINE App
     */

    if(!liff.isInClient()){

      showError(
        '請從 LINE 官方帳號中的按鈕開啟預約頁面。'
      );

      return;

    }


    /*
     * 如果尚未登入
     */

    if(!liff.isLoggedIn()){

      showError(
        '③ 尚未登入 LINE，準備登入…'
      );

      liff.login();

      return;

    }


    showError(
      '③ LINE 登入成功，取得身分資訊…'
    );


    /*
     * 取得 LINE ID Token
     */

    LINE_ID_TOKEN =
      liff.getIDToken();


    if(!LINE_ID_TOKEN){

      throw new Error(
        '無法取得 LINE ID Token。'
      );

    }


    showError(
      '④ LINE 身分驗證資訊取得成功'
    );


    /*
     * 向 GAS 建立預約 Token
     */

    await createBookingToken();


  }

  catch(error){

    console.error(
      'LIFF 初始化錯誤',
      error
    );


    showError(
      '❌ LINE 初始化失敗：\n' +
      (error.message || error)
    );

  }

}



/* =====================================================
   建立預約 Token
===================================================== */

async function createBookingToken(){

  try{

    showError(
      '⑤ 正在驗證 LINE 身分…'
    );


    const url =
      GAS_API_URL +
      '?api=createToken&idToken=' +
      encodeURIComponent(LINE_ID_TOKEN);


    const response =
      await fetch(url);


    if(!response.ok){

      throw new Error(
        'Google Apps Script 回應錯誤：' +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      'createToken result:',
      result
    );


    if(!result.ok){

      throw new Error(
        result.error ||
        'LINE 身分驗證失敗'
      );

    }


    TOKEN =
      result.token;


    if(!TOKEN){

      throw new Error(
        'Google Apps Script 沒有回傳預約 Token'
      );

    }


    showError(
      '⑥ LINE 身分驗證成功'
    );


    /*
     * 驗證完成後載入時段
     */

    loadSlots();

  }

  catch(error){

    console.error(
      'createToken 錯誤',
      error
    );


    showError(
      '❌ LINE 身分驗證失敗：\n' +
      (error.message || error)
    );

  }

}



/* =====================================================
   載入預約時段
===================================================== */

async function loadSlots(){

  const select =
    document.getElementById('slot');

  const button =
    document.getElementById('submitBtn');


  try{

    select.innerHTML =
      '<option value="">正在取得預約時段…</option>';


    button.disabled = true;


    showError(
      '⑦ 正在載入可預約時段…'
    );


    const url =
      GAS_API_URL +
      '?api=getSlots';


    const response =
      await fetch(url);


    if(!response.ok){

      throw new Error(
        '取得時段失敗 HTTP ' +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      'getSlots result:',
      result
    );


    if(!result.ok){

      throw new Error(
        result.error ||
        '無法取得預約時段'
      );

    }


    const slots =
      result.slots || [];


    select.innerHTML =
      '<option value="">請選擇預約時段</option>';


    if(!slots.length){

      select.innerHTML =
        '<option value="">目前無可預約時段</option>';


      showError(
        '目前沒有可預約時段。'
      );


      return;

    }


    /*
     * 建立時段選項
     */

    slots.forEach(function(slot){

      const option =
        document.createElement('option');


      option.value =
        slot.start;


      option.textContent =
        slot.start +
        '–' +
        slot.end +
        '　剩餘 ' +
        slot.remaining +
        ' 名';


      select.appendChild(option);

    });


    button.disabled = false;


    showError(
      '⑧ 可預約時段載入完成'
    );

  }

  catch(error){

    console.error(
      'getSlots 錯誤',
      error
    );


    select.innerHTML =
      '<option value="">時段載入失敗</option>';


    showError(
      '❌ 時段載入失敗：\n' +
      (error.message || error)
    );

  }

}



/* =====================================================
   建立預約
===================================================== */

async function submitBooking(){

  const name =
    document.getElementById('name')
      .value
      .trim();


  const phone =
    document.getElementById('phone')
      .value
      .trim();


  const start =
    document.getElementById('slot')
      .value;


  const button =
    document.getElementById('submitBtn');


  showError('');


  const cleanPhone =
    phone.replace(/\D/g,'');


  /*
   * 姓名
   */

  if(!name){

    showError(
      '請輸入姓名。'
    );

    return;

  }


  /*
   * 手機
   */

  if(!/^09\d{8}$/.test(cleanPhone)){

    showError(
      '請輸入正確的 10 碼手機號碼，例如 0912345678。'
    );

    return;

  }


  /*
   * 時段
   */

  if(!start){

    showError(
      '請選擇預約時段。'
    );

    return;

  }


  /*
   * Token
   */

  if(!TOKEN){

    showError(
      'LINE 預約身分尚未建立，請重新開啟預約頁面。'
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    '預約處理中…';


  try{

    const url =
      GAS_API_URL +
      '?api=submitBooking' +

      '&name=' +
      encodeURIComponent(name) +

      '&phone=' +
      encodeURIComponent(cleanPhone) +

      '&start=' +
      encodeURIComponent(start) +

      '&token=' +
      encodeURIComponent(TOKEN);


    const response =
      await fetch(url);


    if(!response.ok){

      throw new Error(
        '預約 API 錯誤：' +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      'submitBooking result:',
      result
    );


    if(!result.ok){

      throw new Error(
        result.error ||
        '預約失敗'
      );

    }


    /*
     * 顯示成功畫面
     */

    document.getElementById(
      'formCard'
    ).style.display =
      'none';


    document.getElementById(
      'successCard'
    ).style.display =
      'block';


    document.getElementById(
      'successText'
    ).innerHTML =

      '預約編號：<strong>' +
      result.bookingNo +
      '</strong><br><br>' +

      '⏰ ' +
      result.start +
      '–' +
      result.end;


  }

  catch(error){

    console.error(
      'submitBooking 錯誤',
      error
    );


    showError(
      '❌ 預約失敗：\n' +
      (error.message || error)
    );


    button.disabled = false;

    button.textContent =
      '確認預約';


    /*
     * 重新取得最新時段
     */

    loadSlots();

  }

}



/* =====================================================
   啟動
===================================================== */

initLIFF();

</script>

</body>
</html>
